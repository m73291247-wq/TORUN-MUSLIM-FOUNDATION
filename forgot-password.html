
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password - TORUN MUSLIM FOUNDATION</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: #061f18;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 100%;
  max-width: 380px;
  padding: 28px;
  background: #103b2d;
  border-radius: 20px;
  text-align: center;
  border: 1px solid #b99a52;
}

h2 { color: #e6c477; }

p { color: #d5e5dc; line-height: 1.6; }

input {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  border: 1px solid #b99a52;
  border-radius: 9px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  background: #d5b66c;
  color: #102d21;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  font-size: 16px;
}

#message {
  margin-top: 15px;
  overflow-wrap: anywhere;
}

a { color: #e6c477; }
</style>
</head>

<body>
<div class="card">
  <h2>☪ Forgot Password?</h2>
  <h3>TORUN MUSLIM FOUNDATION</h3>
  <p>তোমার Gmail লিখো। আমরা Password Reset Link পাঠাব।</p>

  <form id="resetForm">
    <input type="email" id="email"
      placeholder="তোমার Gmail লিখো" required>
    <button type="submit">Send Reset Link</button>
  </form>

  <p id="message"></p>
  <a href="login.html">Back to Login</a>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import { getAuth, sendPasswordResetEmail }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtctGzGlfCUZRl20DYObnknnCA9pgLbx4",
  authDomain: "torun-muslim-found.firebaseapp.com",
  projectId: "torun-muslim-found",
  storageBucket: "torun-muslim-found.firebasestorage.app",
  messagingSenderId: "247180809222",
  appId: "1:247180809222:web:28d055136f8bc747769f87",
  measurementId: "G-BKFXFKQSQF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message");

  message.textContent = "অপেক্ষা করো...";

  try {
    await sendPasswordResetEmail(auth, email);
    message.textContent = "Reset link পাঠানো হয়েছে। Gmail Inbox দেখো।";
  } catch (error) {
    message.textContent = "সমস্যা: " + error.message;
  }
});
</script>
</body>
</html>
