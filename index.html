
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TORUN MUSLIM FOUNDATION</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4ef;font-family:Arial,sans-serif;color:#183629}
header{background:#075b3d;color:white;padding:17px;position:sticky;top:0;z-index:5}
header h3{margin:0;color:#f4d58c}
header p{margin:5px 0 0;font-size:12px}
.container{max-width:650px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 9px #00000010}
.story{display:flex;gap:12px;overflow:auto}
.story div{min-width:75px;text-align:center;font-size:12px}
.story img{width:62px;height:62px;border-radius:50%;border:3px solid #159765;object-fit:cover}
textarea{width:100%;border:1px solid #dce7df;border-radius:12px;padding:12px;resize:vertical;font:15px Arial}
button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:bold}
.green{background:#08764d;color:white}
.light{background:#e5f2e9;color:#075b3d}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;padding-top:10px;margin-top:12px}
.actions button{background:white;color:#176644}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#dceee2}
.post-img{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 2px;border-top:1px solid #ddd;z-index:10}
nav a{text-decoration:none;color:#176644;font-size:11px;text-align:center}
nav span{display:block;font-size:21px;margin-bottom:3px}
main{padding-bottom:75px}
input[type=file]{display:none}
#status{font-size:13px;color:#08764d;margin:8px 0}
</style>
</head>
<body>

<header>
<h3>☪ TORUN MUSLIM FOUNDATION</h3>
<p>একসাথে ভালো কাজের পথে</p>
</header>

<main class="container">

<div class="card">
<b>Stories</b>
<div class="story" style="margin-top:12px">
<div><img src="https://placehold.co/100x100?text=You"><p>Your Story</p></div>
<div><img src="https://placehold.co/100x100?text=TMF"><p>Foundation</p></div>
<div><img src="https://placehold.co/100x100?text=User"><p>Community</p></div>
</div>
</div>

<div class="card">
<b>What's on your mind?</b>
<textarea id="postText" rows="3" placeholder="তোমার মনের কথা লিখো..."></textarea>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="green" id="postButton" onclick="createPost()">Post</button>
</div>
<p id="status"></p>
</div>

<div id="feed">
<div class="card">পোস্ট লোড হচ্ছে...</div>
</div>

</main>

<nav>
<a href="index.html"><span>🏠</span>Home</a>
<a href="#"><span>👥</span>Community</a>
<a href="#"><span>❤️</span>Donation</a>
<a href="messages.html"><span>💬</span>Messages</a>
<a href="profile.html"><span>👤</span>Profile</a>
</nav>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {getAuth,onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
getFirestore,collection,addDoc,doc,getDoc,
query,orderBy,onSnapshot,serverTimestamp
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAtctGzGlfCUZRl20DYObnknnCA9pgLbx4",
authDomain:"torun-muslim-found.firebaseapp.com",
projectId:"torun-muslim-found",
storageBucket:"torun-muslim-found.firebasestorage.app",
messagingSenderId:"247180809222",
appId:"1:247180809222:web:28d055136f8bc747769f87",
measurementId:"G-BKFXFKQSQF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let stopListening=null;

const feed=document.getElementById("feed");
const status=document.getElementById("status");
const postButton=document.getElementById("postButton");

onAuthStateChanged(auth,async user=>{
if(!user){
location.href="login.html";
return;
}

currentUser=user;
loadPosts();
});

async function createPost(){

if(!currentUser){
alert("আগে Login করো");
return;
}

const text=document.getElementById("postText").value.trim();

if(!text){
alert("আগে কিছু লিখো");
return;
}

postButton.disabled=true;
postButton.textContent="Posting...";
status.textContent="পোস্ট সংরক্ষণ হচ্ছে...";

try{

const userSnap=await getDoc(
doc(db,"users",currentUser.uid)
);

const userData=userSnap.exists()?userSnap.data():{};

const userName=
userData.name||
currentUser.displayName||
"User";

await addDoc(collection(db,"posts"),{
text:text,
userId:currentUser.uid,
userName:userName,
createdAt:serverTimestamp()
});

document.getElementById("postText").value="";
status.textContent="সফল হয়েছে! পোস্ট প্রকাশিত হয়েছে।";

}catch(error){
console.error(error);
status.textContent="পোস্ট হয়নি: "+error.message;
}

finally{
postButton.disabled=false;
postButton.textContent="Post";
}
}

function loadPosts(){

if(stopListening)stopListening();

const postsQuery=query(
collection(db,"posts"),
orderBy("createdAt","desc")
);

stopListening=onSnapshot(postsQuery,snapshot=>{

feed.innerHTML="";

if(snapshot.empty){
feed.innerHTML='<div class="card">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি তুমি করো! ❤️</div>';
return;
}

snapshot.forEach(postDoc=>{
const data=postDoc.data();

const card=document.createElement("div");
card.className="card";

const head=document.createElement("div");
head.className="post-head";

const avatar=document.createElement("img");
avatar.className="avatar";
avatar.src="https://placehold.co/100x100?text=User";

const userInfo=document.createElement("div");
const name=document.createElement("b");
name.textContent=data.userName||"User";

const date=document.createElement("small");
date.textContent=data.createdAt?.toDate?
data.createdAt.toDate().toLocaleString("bn-BD"):
"Just now";

userInfo.append(name,document.createElement("br"),date);
head.append(avatar,userInfo);
card.append(head);

const p=document.createElement("p");
p.textContent=data.text||"";
card.append(p);

const actions=document.createElement("div");
actions.className="actions";

const like=document.createElement("button");
like.textContent="👍 Like";
like.onclick=()=>alert("Like System পরের ধাপে Firebase-এ যুক্ত হবে।");

const comment=document.createElement("button");
comment.textContent="💬 Comment";
comment.onclick=()=>alert("Comment System পরের ধাপে যুক্ত হবে।");

const share=document.createElement("button");
share.textContent="↗ Share";
share.onclick=()=>{
if(navigator.share){
navigator.share({
title:"TORUN MUSLIM FOUNDATION",
text:data.text
}).catch(()=>{});
}else{
alert("এই ব্রাউজারে Share সুবিধা পাওয়া যাচ্ছে না।");
}
};

actions.append(like,comment,share);
card.append(actions);
feed.append(card);

});

},error=>{
console.error(error);
feed.textContent="পোস্ট লোড হয়নি: "+error.message;
});

}

window.createPost=createPost;
</script>

</body>
</html>
