
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - TORUN MUSLIM FOUNDATION</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#063b2b,#087653);
}
.container{
 width:100%;max-width:400px;background:white;
 padding:30px 23px;border-radius:22px;
 box-shadow:0 15px 40px #002b2055;
}
.logo{text-align:center;font-size:40px}
h2{text-align:center;color:#087653;margin:10px 0}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
input{
 width:100%;padding:15px;margin-bottom:15px;
 border:1px solid #d5e5dc;border-radius:12px;
 font-size:15px;outline:none;background:#f7fbf8;
}
input:focus{border-color:#087653}
button{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:linear-gradient(90deg,#087653,#0ba36d);
 color:white;font-size:17px;font-weight:bold;
}
#message{text-align:center;margin-top:15px;color:#087653}
.login{text-align:center;margin-top:20px;color:#555}
a{color:#087653;font-weight:bold}
</style>
</head>

<body>
<div class="container">
<div class="logo">🌙</div>
<h2>TORUN MUSLIM FOUNDATION</h2>
<p class="subtitle">Create Your Account</p>

<form id="registerForm">
<input id="name" type="text" placeholder="Full Name" required>
<input id="phone" type="tel" placeholder="Mobile Number" required>
<input id="email" type="email" placeholder="Gmail Address" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
<input id="confirmPassword" type="password" placeholder="Confirm Password" required>
<button type="submit" id="registerBtn">Create Account</button>
</form>

<p id="message"></p>
<p class="login">Already have an account? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
 getAuth,
 createUserWithEmailAndPassword,
 updateProfile
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAtctGzGlfCUZRl20DYObnknnCA9pgLbx4",
 authDomain: "torun-muslim-found.firebaseapp.com",
 projectId: "torun-muslim-found",
 storageBucket: "torun-muslim-found.firebasestorage.app",
 messagingSenderId: "247180809222",
 appId: "1:247180809222:web:28d055136f8bc747769f87",
 measurementId: "G-BKFXFKQSQF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("registerForm").addEventListener("submit", async (e) => {
 e.preventDefault();

 const name = document.getElementById("name").value.trim();
 const phone = document.getElementById("phone").value.trim();
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const confirmPassword = document.getElementById("confirmPassword").value;
 const message = document.getElementById("message");
 const btn = document.getElementById("registerBtn");

 if(password !== confirmPassword){
  message.textContent = "Password মিলছে না!";
  return;
 }

 btn.disabled = true;
 btn.textContent = "Creating Account...";
 message.textContent = "";

 let userCreated = false;

 try {
  const result = await createUserWithEmailAndPassword(auth,email,password);
  userCreated = true;

  await updateProfile(result.user,{displayName:name});

  await setDoc(doc(db,"users",result.user.uid),{
   name:name,
   phone:phone,
   email:email,
   createdAt:serverTimestamp()
  });

  message.textContent = "Registration Successful!";

  document.getElementById("registerForm").reset();

 } catch(error) {
  if(userCreated){
   message.textContent = "Account তৈরি হয়েছে, কিন্তু Profile save হয়নি। Firestore Rules ঠিক করতে হবে।";
  } else {
   message.textContent = error.message;
  }
 } finally {
  btn.disabled = false;
  btn.textContent = "Create Account";
 }
});
</script>
</body>
</html>
