
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile | TORUN MUSLIM FOUNDATION</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:25px 14px;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#031710,#0b3023,#061d16);
 color:white;
 min-height:100vh;
}

.card{
 max-width:440px;
 margin:20px auto;
 padding:25px 20px;
 background:linear-gradient(145deg,#124432,#09291e);
 border:1px solid #b99a52;
 border-radius:24px;
 text-align:center;
 box-shadow:0 12px 35px #0008;
}

.logo{
 color:#e7c77c;
 font-size:13px;
 letter-spacing:2px;
 margin-bottom:20px;
}

h2{
 color:#f0d28d;
 margin:8px 0 20px;
}

.avatar{
 width:125px;
 height:125px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #d7b66e;
 background:white;
 box-shadow:0 0 20px #d7b66e55;
}

.name{
 color:#f0d28d;
 margin:14px 0 5px;
 font-size:22px;
}

.info{
 color:#d4e4da;
 font-size:14px;
 overflow-wrap:anywhere;
 margin:8px 0;
}

.section{
 margin-top:25px;
 padding:18px;
 background:#061f18;
 border:1px solid #456b53;
 border-radius:16px;
 text-align:left;
}

.section h3{
 color:#e7c77c;
 text-align:center;
 margin:0 0 15px;
}

label{
 display:block;
 color:#e6c77f;
 font-size:13px;
 margin-top:12px;
}

input{
 width:100%;
 padding:13px;
 margin-top:7px;
 border-radius:9px;
 border:1px solid #b99a52;
 background:#f7f8f2;
 color:#152d20;
 font-size:15px;
 outline:none;
}

button{
 width:100%;
 padding:13px;
 margin-top:12px;
 border:0;
 border-radius:10px;
 background:linear-gradient(90deg,#c7a45c,#f0d58f);
 color:#102d21;
 font-weight:bold;
 font-size:14px;
 cursor:pointer;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.secondary{
 background:#174d38;
 color:white;
 border:1px solid #b99a52;
}

.danger{
 background:#77352f;
 color:white;
}

#editBox[hidden]{
 display:none!important;
}

#message{
 color:#f0d28d;
 font-size:13px;
 line-height:1.5;
 overflow-wrap:anywhere;
}

.footer{
 color:#9bb8a6;
 font-size:11px;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">☪ TORUN MUSLIM FOUNDATION</div>

<h2>My Profile</h2>

<img id="photo" class="avatar"
src="https://placehold.co/125x125?text=User">

<h3 id="name" class="name">Loading...</h3>

<p id="email" class="info"></p>
<p id="phone" class="info"></p>

<button id="editButton">
✏️ Edit Profile
</button>

<div id="editBox" class="section" hidden>

<h3>Edit Your Profile</h3>

<label>Your Name</label>
<input id="editName" type="text"
placeholder="তোমার নাম লিখো">

<label>Mobile Number</label>
<input id="editPhone" type="tel"
placeholder="মোবাইল নম্বর লিখো">

<button id="saveProfile">
Save Changes
</button>

<button id="cancelEdit" class="secondary">
Cancel
</button>

</div>

<div class="section">

<h3>Change Profile Photo</h3>

<input type="file" id="photoInput"
accept="image/*">

<button id="savePhoto">
Upload New Photo
</button>

</div>

<p id="message"></p>

<button class="secondary"
onclick="location.href='index.html'">
⌂ Back to Dashboard
</button>

<button id="logout" class="danger">
Logout
</button>

<div class="footer">
TORUN MUSLIM FOUNDATION © 2026
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,updateDoc
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAtctGzGlfCUZRl20DYObnknnCA9pgLbx4",
 authDomain:"torun-muslim-found.firebaseapp.com",
 projectId:"torun-muslim-found",
 storageBucket:"torun-muslim-found.firebasestorage.app",
 messagingSenderId:"247180809222",
 appId:"1:247180809222:web:28d055136f8bc747769f87",
 measurementId:"G-BKFXFKQSQF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const WORKER_URL=
"https://torun-muslim-upload.m73291247.workers.dev/";

let currentUser=null;
let selectedPhoto=null;
let previewURL=null;

const photo=document.getElementById("photo");
const message=document.getElementById("message");
const editBox=document.getElementById("editBox");

function showMessage(text){
 message.textContent=text;
}

// LOAD PROFILE

onAuthStateChanged(auth,async user=>{

 if(!user){
  location.href="login.html";
  return;
 }

 currentUser=user;

 document.getElementById("email").textContent=
 "Gmail: "+(user.email || "");

 if(user.photoURL){
  photo.src=user.photoURL;
 }

 try{

  const snap=await getDoc(doc(db,"users",user.uid));

  if(snap.exists()){

   const data=snap.data();

   const name=data.name || user.displayName || "User";
   const phone=data.phone || "";

   document.getElementById("name").textContent=name;
   document.getElementById("phone").textContent=
   "Mobile: "+(phone || "Not added");

   document.getElementById("editName").value=name;
   document.getElementById("editPhone").value=phone;

  }else{

   document.getElementById("name").textContent=
   user.displayName || "User";

   document.getElementById("editName").value=
   user.displayName || "";

  }

 }catch(error){

  showMessage("Profile load হয়নি: "+error.message);

 }

});

// OPEN EDIT BOX

document.getElementById("editButton")
.onclick=()=>{

 editBox.hidden=false;

 document.getElementById("editButton").hidden=true;

 showMessage("তোমার তথ্য পরিবর্তন করো।");

};

// CANCEL EDIT

document.getElementById("cancelEdit")
.onclick=()=>{

 editBox.hidden=true;

 document.getElementById("editButton").hidden=false;

 showMessage("");

};

// SAVE PROFILE

document.getElementById("saveProfile")
.onclick=async()=>{

 if(!currentUser)return;

 const name=document.getElementById("editName")
 .value.trim();

 const phone=document.getElementById("editPhone")
 .value.trim();

 if(!name){
  alert("তোমার নাম লিখো।");
  return;
 }

 const button=document.getElementById("saveProfile");

 button.disabled=true;
 button.textContent="Saving...";

 try{

  const userRef=doc(db,"users",currentUser.uid);

  const snap=await getDoc(userRef);

  if(!snap.exists()){
   throw new Error("User profile পাওয়া যায়নি।");
  }

  await updateDoc(userRef,{
   name:name,
   phone:phone
  });

  await updateProfile(currentUser,{
   displayName:name
  });

  document.getElementById("name").textContent=name;

  document.getElementById("phone").textContent=
  "Mobile: "+(phone || "Not added");

  editBox.hidden=true;
  document.getElementById("editButton").hidden=false;

  showMessage("সফল হয়েছে! Profile আপডেট করা হয়েছে।");

 }catch(error){

  showMessage("Update হয়নি: "+error.message);

 }finally{

  button.disabled=false;
  button.textContent="Save Changes";

 }

};

// SELECT PHOTO

document.getElementById("photoInput")
.addEventListener("change",e=>{

 const file=e.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("শুধু ছবি নির্বাচন করো।");
  e.target.value="";
  return;
 }

 if(file.size>1024*1024){
  alert("ছবির সাইজ ১ MB-এর কম রাখো।");
  e.target.value="";
  return;
 }

 selectedPhoto=file;

 if(previewURL){
  URL.revokeObjectURL(previewURL);
 }

 previewURL=URL.createObjectURL(file);
 photo.src=previewURL;

 showMessage("ছবি নির্বাচন করা হয়েছে।");

});

// UPLOAD PHOTO

document.getElementById("savePhoto")
.onclick=async()=>{

 if(!currentUser || !selectedPhoto){
  alert("আগে একটি ছবি নির্বাচন করো।");
  return;
 }

 const button=document.getElementById("savePhoto");

 button.disabled=true;
 button.textContent="Uploading...";

 try{

  const authResponse=await fetch(WORKER_URL);

  if(!authResponse.ok){
   throw new Error(
    "Worker error: "+await authResponse.text()
   );
  }

  const authData=await authResponse.json();

  const formData=new FormData();

  formData.append("file",selectedPhoto);
  formData.append("fileName",selectedPhoto.name);
  formData.append("publicKey",authData.publicKey);
  formData.append("token",authData.token);
  formData.append("expire",authData.expire);
  formData.append("signature",authData.signature);

  const uploadResponse=await fetch(
   "https://upload.imagekit.io/api/v1/files/upload",
   {
    method:"POST",
    body:formData
   }
  );

  const result=await uploadResponse.json();

  if(!uploadResponse.ok){
   throw new Error(
    result.message || "ImageKit upload failed"
   );
  }

  if(!result.url){
   throw new Error("Image URL পাওয়া যায়নি।");
  }

  await updateProfile(currentUser,{
   photoURL:result.url
  });

  photo.src=result.url;
  selectedPhoto=null;

  document.getElementById("photoInput").value="";

  if(previewURL){
   URL.revokeObjectURL(previewURL);
   previewURL=null;
  }

  showMessage("সফল হয়েছে! নতুন Profile Photo সংরক্ষণ হয়েছে।");

 }catch(error){

  showMessage("ছবি আপলোড হয়নি: "+error.message);

 }finally{

  button.disabled=false;
  button.textContent="Upload New Photo";

 }

};

// LOGOUT

document.getElementById("logout")
.onclick=async()=>{

 await signOut(auth);
 location.href="login.html";

};

</script>

</body>
</html>
