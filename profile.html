
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile - TORUN MUSLIM FOUNDATION</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;font-family:Arial;
 background:#061f18;color:white;
}
.card{
 max-width:420px;margin:30px auto;padding:25px;
 background:#103b2d;border:1px solid #b99a52;
 border-radius:20px;text-align:center;
}
h2{color:#e6c477}
.avatar{
 width:110px;height:110px;border-radius:50%;
 object-fit:cover;border:3px solid #d5b66c;
 background:#fff;
}
input{
 width:100%;padding:12px;margin:10px 0;
 border-radius:8px;border:1px solid #b99a52;
}
button{
 width:100%;padding:13px;margin-top:12px;
 border:0;border-radius:9px;
 background:#d5b66c;color:#102d21;
 font-weight:bold;font-size:15px;
}
.info{color:#d5e5dc;overflow-wrap:anywhere}
h3{color:#e6c477}
</style>
</head>

<body>

<div class="card">

<h2>☪ My Profile</h2>

<img id="photo" class="avatar"
src="https://placehold.co/110x110?text=User">

<h3 id="name">Loading...</h3>
<p id="email" class="info"></p>
<p id="phone" class="info"></p>

<hr>

<h3>Edit Profile</h3>

<input type="text" id="editName"
placeholder="তোমার নাম">

<input type="tel" id="editPhone"
placeholder="মোবাইল নম্বর">

<button id="saveProfile">Save Profile Changes</button>

<hr>

<h3>Change Profile Photo</h3>

<input type="file" id="photoInput" accept="image/*">

<button id="savePhoto">Save Profile Photo</button>

<p id="message"></p>

<button onclick="location.href='index.html'">
Back to Dashboard
</button>

<button id="logout">Logout</button>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,updateDoc
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAtctGzGlfCUZRl20DYObnknnCA9pgLbx4",
 authDomain:"torun-muslim-found.firebaseapp.com",
 projectId:"torun-muslim-found",
 storageBucket:"torun-muslim-found.firebasestorage.app",
 messagingSenderId:"247180809222",
 appId:"1:247180809222:web:28d055136f8bc747769f87",
 measurementId:"G-BKFXFKQSQF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const WORKER_URL =
"https://torun-muslim-upload.m73291247.workers.dev/";

let currentUser=null;
let selectedPhoto=null;
let previewURL=null;

const photo=document.getElementById("photo");
const message=document.getElementById("message");

onAuthStateChanged(auth,async user=>{

 if(!user){
  location.href="login.html";
  return;
 }

 currentUser=user;

 document.getElementById("email").textContent=
 "Gmail: "+(user.email || "");

 if(user.photoURL){
  photo.src=user.photoURL;
 }

 try{

  const snap=await getDoc(doc(db,"users",user.uid));

  if(snap.exists()){

   const data=snap.data();

   document.getElementById("name").textContent=
   data.name || user.displayName || "User";

   document.getElementById("phone").textContent=
   "Mobile: "+(data.phone || "Not added");

   document.getElementById("editName").value=
   data.name || user.displayName || "";

   document.getElementById("editPhone").value=
   data.phone || "";

  }else{

   document.getElementById("name").textContent=
   user.displayName || "User";

   document.getElementById("editName").value=
   user.displayName || "";

  }

 }catch(error){

  message.textContent=
  "Profile load হয়নি: "+error.message;

 }

});

// SAVE PROFILE INFORMATION

document.getElementById("saveProfile")
.onclick=async()=>{

 if(!currentUser)return;

 const name=document.getElementById("editName")
 .value.trim();

 const phone=document.getElementById("editPhone")
 .value.trim();

 if(!name){
  alert("তোমার নাম লিখো।");
  return;
 }

 const button=document.getElementById("saveProfile");

 button.disabled=true;
 button.textContent="Saving...";

 try{

  const userRef=doc(db,"users",currentUser.uid);

  const snap=await getDoc(userRef);

  if(!snap.exists()){
   throw new Error("User profile পাওয়া যায়নি।");
  }

  await updateDoc(userRef,{
   name:name,
   phone:phone
  });

  await updateProfile(currentUser,{
   displayName:name
  });

  document.getElementById("name").textContent=name;

  document.getElementById("phone").textContent=
  "Mobile: "+(phone || "Not added");

  message.textContent=
  "Profile information সফলভাবে আপডেট হয়েছে!";

 }catch(error){

  message.textContent=
  "Update হয়নি: "+error.message;

 }finally{

  button.disabled=false;
  button.textContent="Save Profile Changes";

 }

};

// SELECT PHOTO

document.getElementById("photoInput")
.addEventListener("change",e=>{

 const file=e.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("শুধু ছবি নির্বাচন করো।");
  e.target.value="";
  return;
 }

 if(file.size>1024*1024){
  alert("ছবির সাইজ ১ MB-এর কম রাখো।");
  e.target.value="";
  return;
 }

 selectedPhoto=file;

 if(previewURL){
  URL.revokeObjectURL(previewURL);
 }

 previewURL=URL.createObjectURL(file);
 photo.src=previewURL;

 message.textContent="ছবি নির্বাচন করা হয়েছে।";

});

// UPLOAD PHOTO

document.getElementById("savePhoto")
.onclick=async()=>{

 if(!currentUser || !selectedPhoto){
  alert("আগে একটি ছবি নির্বাচন করো।");
  return;
 }

 const button=document.getElementById("savePhoto");

 button.disabled=true;
 button.textContent="Uploading...";

 try{

  const authResponse=await fetch(WORKER_URL);

  if(!authResponse.ok){
   throw new Error(
    "Worker error: "+await authResponse.text()
   );
  }

  const authData=await authResponse.json();

  const formData=new FormData();

  formData.append("file",selectedPhoto);
  formData.append("fileName",selectedPhoto.name);
  formData.append("publicKey",authData.publicKey);
  formData.append("token",authData.token);
  formData.append("expire",authData.expire);
  formData.append("signature",authData.signature);

  const uploadResponse=await fetch(
   "https://upload.imagekit.io/api/v1/files/upload",
   {
    method:"POST",
    body:formData
   }
  );

  const result=await uploadResponse.json();

  if(!uploadResponse.ok){
   throw new Error(
    result.message || "ImageKit upload failed"
   );
  }

  if(!result.url){
   throw new Error("Image URL পাওয়া যায়নি।");
  }

  await updateProfile(currentUser,{
   photoURL:result.url
  });

  photo.src=result.url;

  selectedPhoto=null;
  document.getElementById("photoInput").value="";

  if(previewURL){
   URL.revokeObjectURL(previewURL);
   previewURL=null;
  }

  message.textContent=
  "Profile Photo সফলভাবে সংরক্ষণ হয়েছে!";

 }catch(error){

  message.textContent=
  "ছবি আপলোড হয়নি: "+error.message;

 }finally{

  button.disabled=false;
  button.textContent="Save Profile Photo";

 }

};

// LOGOUT

document.getElementById("logout")
.onclick=async()=>{

 await signOut(auth);
 location.href="login.html";

};

</script>
</body>
</html>
